name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 同梱するjkcnsl (コメント機能が使う外部ツール)。NicoJKのリリースと同じ版・同じzipを使う
  JKCNSL_VERSION: v20261018a
  JKCNSL_SHA256: 351c846bc4ba59f6c1e476e0c513715d9d9a1b5ba3a15c8d019b5de91cd9b137

jobs:
  build:
    # windows-latest が VS18 系に更新され v143 ツールセットが消えたため固定 (MSB8020 回避)
    runs-on: windows-2022

    strategy:
      matrix:
        platform: [x86, x64, ARM64]

    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
    - uses: actions/checkout@v5
      with:
        # libaribcaptionとdantto4k (TTMLのパーサ) をサブモジュールとして取り込んでビルドしている。
        # dantto4kの中のサブモジュール (tsduck、asio) は使わないので取得しない
        submodules: true
        # ビルドした版 (git describe --tags) を埋め込むので、履歴とタグを取得する
        fetch-depth: 0

    - name: Get version
      id: version
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $v = "${{ github.event.inputs.version }}"
        } else {
          $v = "${{ github.ref_name }}"
        }
        Write-Output "VERSION=$v" >> $env:GITHUB_OUTPUT

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Restore NuGet packages
      run: nuget restore

    - name: Build tvtp
      env:
        PLATFORM: ${{ matrix.platform }}
        VERSION: ${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}
      run: msbuild /m /p:Configuration=Release /p:Platform=$env:PLATFORM /p:PlatformToolset=v143 .

    - name: Run startup smoke tests
      if: matrix.platform != 'ARM64'
      env:
        PLATFORM: ${{ matrix.platform }}
      run: |
        $projectPlatform = if ($env:PLATFORM -eq 'x86') { 'Win32' } else { $env:PLATFORM }
        & ".\$projectPlatform\Release\StartupSmokeTests.exe"
        if ($LASTEXITCODE -ne 0) { throw "Startup smoke tests failed with exit code $LASTEXITCODE" }

    - uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache-dependency-path: ./browser/package-lock.json

    - name: Install npm packages
      working-directory: ./browser/
      run: npm ci

    - name: Build web-bml
      working-directory: ./browser/
      run: npm run build

    # jkcnslのライセンスとREADMEを、同梱する実行ファイルと同じタグから取得する
    - name: Checkout jkcnsl metadata
      uses: actions/checkout@v5
      with:
        repository: nanamitm/jkcnsl
        ref: ${{ env.JKCNSL_VERSION }}
        path: jkcnsl-source

    # jkcnslはwin-x64版のみ。x86/ARM64版のzipにも同じものを入れる
    # (64bit Windowsなら32bitのTVTestからでも起動でき、ARM64版Windowsではx64エミュレーションで動く)
    - name: Download jkcnsl release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $asset = "jkcnsl-windows-x64-$env:JKCNSL_VERSION.zip"
        New-Item -ItemType Directory -Force -Path 'jkcnsl-download' | Out-Null
        gh release download $env:JKCNSL_VERSION --repo nanamitm/jkcnsl --pattern $asset --dir 'jkcnsl-download'
        if ($LASTEXITCODE -ne 0) { throw "jkcnsl download failed: $asset" }

        $archive = Join-Path 'jkcnsl-download' $asset
        $actualHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
        if ($actualHash -ne $env:JKCNSL_SHA256) {
          throw "jkcnsl checksum mismatch: expected $env:JKCNSL_SHA256, actual $actualHash"
        }

        Expand-Archive -LiteralPath $archive -DestinationPath 'jkcnsl-expanded'
        foreach ($f in 'jkcnsl.exe', 'JkcnslLoginWindow.exe') {
          if (-not (Test-Path "jkcnsl-expanded/jkcnsl/$f")) { throw "$f was not found in the jkcnsl release archive" }
        }
        Copy-Item 'jkcnsl-source/License.txt', 'jkcnsl-source/Readme.txt' 'jkcnsl-expanded/jkcnsl/'

    - name: Package
      env:
        PLATFORM: ${{ matrix.platform }}
        VERSION: ${{ steps.version.outputs.VERSION }}
      run: |
        $name = "TVTDataBroadcastingWV2-$env:VERSION-$env:PLATFORM"
        mkdir $name
        copy LICENSE "$name/TVTDataBroadcastingWV2-LICENSE"
        copy LICENSE.nlohmann.json.txt "$name/TVTDataBroadcastingWV2-LICENSE.json.txt"
        copy LICENSE.libaribcaption.txt "$name/TVTDataBroadcastingWV2-LICENSE.libaribcaption.txt"
        copy LICENSE.dantto4k.txt "$name/TVTDataBroadcastingWV2-LICENSE.dantto4k.txt"
        copy README.md "$name/TVTDataBroadcastingWV2-README.txt"
        copy -ErrorAction:SilentlyContinue Release/TVTDataBroadcastingWV2.tvtp $name/ || copy "$env:PLATFORM/Release/TVTDataBroadcastingWV2.tvtp" $name/
        mkdir "$name/TVTDataBroadcastingWV2/resources/dist"
        copy browser/dist/TVTDataBroadcastingWV2.js "$name/TVTDataBroadcastingWV2/resources/dist/"
        copy browser/node_modules/web-bml-fonts/*.woff2 "$name/TVTDataBroadcastingWV2/resources/dist/"
        copy browser/node_modules/web-bml-fonts/LICENSE.txt "$name/TVTDataBroadcastingWV2/resources/dist/fonts-LICENSE.txt"
        copy browser/dist/TVTDataBroadcastingWV2.js.LICENSE.txt "$name/TVTDataBroadcastingWV2/resources/dist/"
        copy browser/TVTDataBroadcastingWV2.html "$name/TVTDataBroadcastingWV2/resources/"
        Copy-Item -Recurse 'jkcnsl-expanded/jkcnsl' "$name/jkcnsl"
        Compress-Archive -Path $name -DestinationPath "$name.zip"

    - uses: actions/upload-artifact@v7
      with:
        name: TVTDataBroadcastingWV2-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}
        path: TVTDataBroadcastingWV2-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/download-artifact@v8
      with:
        path: artifacts/
        merge-multiple: true

    - uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.build.outputs.version }}
        name: ${{ needs.build.outputs.version }}
        files: artifacts/*.zip
        generate_release_notes: true
        body: |
          コメント機能で使うjkcnsl ${{ env.JKCNSL_VERSION }} (JkcnslLoginWindowを含むwin-x64版) を同梱しています。
          `jkcnsl` フォルダの中身をTVTest.exeのあるフォルダに配置してください。
