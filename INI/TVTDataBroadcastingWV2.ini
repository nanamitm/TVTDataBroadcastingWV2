[TVTDataBroadcastingWV2]
; 起動時に自動的にプラグインを有効化する（0=無効、1=有効）
AutoEnable=0

; ネットワーク機能を有効化する（0=無効、1=有効）
EnableNetwork=0

; 通信コンテンツ取得時にサーバ証明書の検証エラーを無視する（0=検証する、1=無視する）
; 1にすると通信内容を第三者に読み書きされうるため、繋がらない場合のみ使用する
IgnoreCertificateErrors=0

; 実況勢いパネルのWebSocket接続先URI
ChannelsWsUri=ws://localhost:5000/api/channels/ws

; コメント取得を有効化する（0=無効、1=有効）
EnableComment=0

; リモコン操作を無効化する（0=無効化しない、1=無効化）
DisableRemoteControl=0

; TVTestの音量設定を使用する（0=使用しない、1=使用する）
UseTVTestVolume=1

; TVTestのチャンネル変更コマンドを使用する（0=使用しない、1=使用する）
UseTVTestChannelCommand=1

; プラグイン無効化時に字幕状態を復元する（0=復元しない、1=復元する）
RestoreCaptionState=0

; プラグイン有効化時に字幕を自動的に有効化する（0=しない、1=する）
AutoEnableCaption=0

; リソースディレクトリのパス（省略時はプラグインと同じフォルダのresources\）
; ResourceDirectory=

; コメント表示（0=非表示、1=表示）
CommentEnabled=1

; コメントの不透明度（0〜100%）
CommentOpacity=100

; コメントのスクロール時間（1000〜5000 ms）
CommentDuration=4000

; コメントの文字サイズ・medium基準（8〜64px）、small=x0.75、big=x1.5
CommentFontSize=24

; コメントの影（0=無効、1=有効）
CommentShadow=1

; コメントの縁取り（0=無効、1=有効）
CommentOutline=0

; コメントの影の色（CSSカラー文字列）
CommentShadowColor=rgba(0,0,0,0.7)

; 投稿欄の背景色（NicoJK相当）。投稿先が避難所(R接続)ならRefugeEditBoxColor、
; ニコニコ(L接続)ならNicoEditBoxColorで着色します。
;NicoEditBoxColor=#bbbbff
;RefugeEditBoxColor=#ffbbbb

; ===== 接続方式（NicoJK互換） =====
; 避難所URLテンプレート。{jkID}→jk{n}、{chatStreamID}→refugeChatStreamIDに置換されます。
; 設定すると、対応チャンネルは Rコマンドで避難所(NX-Jikkyo等)に接続します。
; 空にすると内蔵テーブル/[ChatStreams]のchatStreamIDで Lコマンド=ニコニコ直結になります。
;RefugeUri=wss://nx-jikkyo.tsukumijima.net/api/v1/channels/{jkID}/ws/watch

; 1 でニコニコ実況と避難所の両方に同時接続（要chatStreamID）。0で片方のみ（既定）。
RefugeMixing=0

; 1 で転送(refuge側に流れてきたニコ由来)コメントを除去（Rコマンドのtype=2）。
DropForwardedComment=0

; mixing時の投稿先。0=ニコニコ / 1=避難所。
PostToRefuge=0

; ===== [ChatStreams] =====
; チャンネル(jkID)毎のストリームID表。書式: {jkID}={chatStreamID}[,{refugeChatStreamID}]
;   カンマ無し      … nico/避難所とも同じID
;   ID,            … nicoのみ
;   ,値            … 避難所のみ（nico無し）。値はrefugeUriの{chatStreamID}に入る（フラグ兼用）
;   （空）          … そのjkIDを削除
; 内蔵テーブル(jk1-9/101/211のニコ公式ch)に上書きマージされます。
; 例:
; [ChatStreams]
; 141=,NX
; 211=ch2646846,NX

; ===== [Channels] =====
; ネットワーク/サービスID → 実況ID(jk番号) の対照表（NicoJK互換）。
; 書式: 0x{NetCat}{ServiceID_16進4桁}={jk番号}
;   NetCat … 地上波=F、それ以外は実NetworkID（BS=4、スカパー=6/7、スカパープレミアム等は実値）
;   {jk番号} … 対応する実況ID。先頭に + を付けると逆方向(jk→選局)でこのチャンネルを優先。
;              0 または -1 を指定するとそのサービスを明示的に「対応なし」にできる。
; 内蔵テーブルに上書きマージされ、ここに書いた定義が優先されます。
; 隣に NicoJK.ini があればその[Channels]も参照しますが、無くてもこの記述だけで動作します。
; 例: AT-X をスカパー(0x014D)・スカパープレミアム(0x829B)どちらでもjk333にし、
;     jk333選択時はプレミアム(+付き)へ選局する
; [Channels]
; 0xa829b=+333
; 0x7014d=333

; NG（あぼーん）設定。該当するコメントは非表示になります。
; キーは連番（0,1,2,...）。番号の欠けは無視されるので自由に追加・削除できます。
;   Regex{n}=   コメント本文に対する正規表現（部分一致 / std::regex ECMAScript）
;   User{n}=    user_id 完全一致でそのユーザを非表示
;   Command{n}= mailフィールドのコマンド完全一致（例: 184 で匿名コメントを非表示）
; 例:
; [NG]
; Regex0=(https?://|ｈｔｔｐ)
; Regex1=^[wｗ]+$
; User0=ABCdef12345
; Command0=184

; ===== 過去ログ記録 =====
; 1 で受信コメントをファイルに記録（NicoJK互換形式）。0 で記録しない（既定）。
LogfileMode=0
; 記録先フォルダ。NicoJKと衝突しないよう別フォルダを指定してください。
; フォルダ内に jk{番号}/{Unix時刻}.txt が作成されます。
;LogfileFolder=C:\Free Soft Ware\TVTestBuild\Plugins\TVTDataBroadcastingWV2\Log

; [CustomReplace] chatタグ表示前の置換リスト（NicoJK互換）。
; 置換対象はコメント本文ではなく "<chat ...>本文</chat>" のタグ全体で、置換した結果を
; 解釈しなおしてから表示・NG判定を行います。ログファイルには置換前の原文が残ります。
; Pattern{数値}=s{区切り}正規表現{区切り}置換{区切り}g の形式で、{数値}の昇順に処理します。
; 区切り文字は s の次の1文字（例では / や #）。置換文字列では $1 等の後方参照が使えます。
; 先頭を大文字 S にするとそのパターンは無効になります（S/.../.../g）。
; 正規表現はSTLのstd::regex（ECMAScript）そのままで、誤りがあればTVTestのログに報告します。
; 旧バージョンの Replace{数値} も同じ意味で読みますが、対象はタグ全体に変わっています。
; 日本語を含むパターンを書くときはこのファイルをUTF-16LE(BOM付き)で保存してください。
;
; NicoJKのローカル拡張属性を付けると表示を変えられます:
;   abone="1"          そのコメントを表示しない
;   align="left|right" 上下コメの寄せ（既定は中央）
;   insert_at="last"   上下コメを直前のコメントの隣に積む
;   yourpost="1"       背景を敷いて強調表示する
;
; 例:
; [CustomReplace]
; Comment100=色コメand/or上下コメをNGする
; Pattern100=s/^<chat(?![^>]*? mail="(?:184|big|small|ue|shita| )*")(?=[^>]*? mail=)(?![^>]*? abone=)/<chat abone="1"/g
; Pattern101=s/^<chat(?=[^>]*? mail="(?:[^"]*? )?(?:ue|shita)[ "])(?![^>]*? abone=)/<chat abone="1"/g
; Comment110=デフォルト色をcyanにする
; Pattern110=s/^<chat(?![^>]*? mail=)/<chat mail=""/g
; Pattern111=s/^([^>]*? mail=")((?:184|big|small|ue|shita| )*")/$1cyan $2/g
; Comment120=草刈り
; Pattern120=s#(w|ｗ)\1*</chat>$#$1</chat>#g
; Comment160=下コメを左上にする
; Pattern160=s/^<chat([^>]*? mail="[^"]*?)shita/<chat align="left"$1ue small/g
